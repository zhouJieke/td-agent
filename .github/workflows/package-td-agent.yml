name: Package Td-Agent

on:
  push:
    branches:
      - 'codex/td-agent-package-all-*'
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to package
        type: choice
        options:
          - all
          - macos
          - macos-aarch64
          - windows
        default: all

permissions:
  contents: read

concurrency:
  group: package-td-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: Package macOS
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'macos' || inputs.platform == 'macos-aarch64'
    uses: ./.github/workflows/build-macos.yml
    with:
      platform_filter: ${{ inputs.platform == 'macos-aarch64' && 'macos-aarch64' || 'all' }}
      source_ref: ${{ github.sha }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  windows:
    name: Package Windows
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'windows'
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ github.sha }}
